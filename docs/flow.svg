<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700"
     font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#94a3b8"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="760" height="700" rx="18" fill="#f8faff"/>

  <!-- ── Title ── -->
  <text x="380" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b" letter-spacing="0.5">ATRA 전체 실행 흐름</text>

  <!-- ── START ── -->
  <rect x="280" y="52" width="200" height="42" rx="21" fill="#2563eb" filter="url(#sh)"/>
  <text x="380" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">python main.py</text>

  <!-- arrow → mode -->
  <line x1="380" y1="94" x2="380" y2="114" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 모드 선택 ── -->
  <rect x="270" y="114" width="220" height="52" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">① 모드 선택</text>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#475569">실행 방식을 선택합니다</text>

  <!-- branch left label -->
  <text x="155" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">테스트 실행</text>

  <!-- branch right label -->
  <text x="610" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">로그로 리포트만</text>

  <!-- left branch line: 270→170, down to device -->
  <line x1="270" y1="140" x2="190" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="140" x2="190" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- right branch line: 490→570, down -->
  <line x1="490" y1="140" x2="570" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="570" y1="140" x2="570" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LEFT: 기기 선택 ── -->
  <rect x="110" y="200" width="160" height="52" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">② 기기 선택</text>
  <text x="190" y="240" text-anchor="middle" font-size="11" fill="#475569">ADB 연결 기기 확인</text>

  <line x1="190" y1="252" x2="190" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LEFT: 테스트 실행 ── -->
  <rect x="110" y="282" width="160" height="52" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">③ 테스트 자동 실행</text>
  <text x="190" y="320" text-anchor="middle" font-size="11" fill="#475569">Appium · 병렬 · 녹화</text>

  <!-- ── RIGHT: 로그 폴더 선택 ── -->
  <rect x="490" y="200" width="160" height="52" rx="10" fill="#fff" stroke="#e0f2fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">로그 폴더 선택</text>
  <text x="570" y="240" text-anchor="middle" font-size="11" fill="#475569">이전 로그 경로 지정</text>

  <!-- merge: left down then right to center -->
  <line x1="190" y1="334" x2="190" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="384" x2="370" y2="384" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- merge: right down then left to center -->
  <line x1="570" y1="252" x2="570" y2="384" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="570" y1="384" x2="390" y2="384" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 결과 분석 ── -->
  <rect x="280" y="384" width="200" height="52" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">④ 결과 분석</text>
  <text x="380" y="422" text-anchor="middle" font-size="11" fill="#475569">로그 파싱 · 상태 분류</text>

  <line x1="380" y1="436" x2="380" y2="466" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 실패 검토 ── -->
  <rect x="280" y="466" width="200" height="52" rx="10" fill="#fff" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="488" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">⑤ 실패 검토</text>
  <text x="380" y="504" text-anchor="middle" font-size="11" fill="#475569">스크린샷 · 로그 확인</text>

  <line x1="380" y1="518" x2="380" y2="548" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── PLM 이슈 입력 ── -->
  <rect x="280" y="548" width="200" height="52" rx="10" fill="#fff" stroke="#dbeafe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">⑥ PLM 이슈 입력</text>
  <text x="380" y="586" text-anchor="middle" font-size="11" fill="#475569">이슈 번호 · 코멘트 기록</text>

  <!-- split to two finals -->
  <line x1="380" y1="600" x2="380" y2="618" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="210" y1="618" x2="550" y2="618" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="210" y1="618" x2="210" y2="635" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="618" x2="550" y2="635" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── HTML 리포트 ── -->
  <rect x="110" y="635" width="200" height="48" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="210" y="656" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">⑦ HTML 리포트 생성</text>
  <text x="210" y="672" text-anchor="middle" font-size="11" fill="#15803d">result.html 자동 저장</text>

  <!-- ── 이메일 폼 ── -->
  <rect x="450" y="635" width="200" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="550" y="656" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">⑧ 이메일 폼 생성</text>
  <text x="550" y="672" text-anchor="middle" font-size="11" fill="#1e40af">이메일 전송 준비 완료</text>
</svg>
