<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220"
     font-family="'Cascadia Code','Consolas','Courier New',monospace">
  <defs>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="10" y="10" width="660" height="200" rx="12" fill="#1e1e2e" filter="url(#sh)"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="660" height="36" rx="12" fill="#2a2a3d"/>
  <rect x="10" y="34" width="660" height="12" fill="#2a2a3d"/>

  <!-- Traffic lights -->
  <circle cx="38" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="60" cy="28" r="6" fill="#febc2e"/>
  <circle cx="82" cy="28" r="6" fill="#28c840"/>

  <!-- Title text -->
  <text x="340" y="32" text-anchor="middle" font-size="12" fill="#8b8ba7">PowerShell  —  ATRA</text>

  <!-- Terminal content -->
  <!-- Line 1: directory prompt -->
  <text x="30" y="72" font-size="13" fill="#6272a4">PS</text>
  <text x="54" y="72" font-size="13" fill="#8b8ba7"> C:\Users\user\ATRA</text>
  <text x="258" y="72" font-size="13" fill="#50fa7b">&gt;</text>

  <!-- Command -->
  <text x="274" y="72" font-size="13" fill="#f8f8f2"> python main.py</text>

  <!-- Cursor blink -->
  <rect x="408" y="59" width="9" height="16" rx="1" fill="#f8f8f2" opacity="0.85"/>

  <!-- Line 2: blank -->

  <!-- Line 3: app launch message -->
  <text x="30" y="104" font-size="12" fill="#6272a4">#</text>
  <text x="46" y="104" font-size="12" fill="#8b8ba7"> Appium 드라이버 확인 중...</text>

  <!-- Line 4 -->
  <text x="30" y="124" font-size="12" fill="#50fa7b">✓</text>
  <text x="50" y="124" font-size="12" fill="#f8f8f2"> uiautomator2 드라이버 확인 완료</text>

  <!-- Line 5 -->
  <text x="30" y="144" font-size="12" fill="#50fa7b">✓</text>
  <text x="50" y="144" font-size="12" fill="#f8f8f2"> ADB 연결 기기 3대 감지</text>

  <!-- Line 6: blank -->

  <!-- Line 7: launch -->
  <text x="30" y="170" font-size="12" fill="#bd93f9">→</text>
  <text x="50" y="170" font-size="12" fill="#f8f8f2"> ATRA 창을 시작합니다</text>

  <!-- Line 8: window title -->
  <text x="30" y="190" font-size="12" fill="#6272a4">  ATRA — Android Test Report Automation  [v1.0.0]</text>
</svg>
